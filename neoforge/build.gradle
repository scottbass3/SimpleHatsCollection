plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

neoForge {
    version = neoforge_version
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})"
        }
        client {
            client()
        }
        server {
            server()
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    // Accessories for NeoForge pulls in Sinytra's Forgified Fabric API.
    maven { url = 'https://maven.su5ed.dev/releases' }
}

dependencies {
    implementation("io.wispforest:accessories-neoforge:${accessories_version}")
    implementation("curse.maven:simplehats-${simplehats_curse_project}:${simplehats_curse_neoforge}")
    // oωo is required by SimpleHats at runtime; not used by this addon directly.
    runtimeOnly("io.wispforest:owo-lib-neoforge:${owo_neoforge_version}")
}
