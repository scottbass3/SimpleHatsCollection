name: Release

# Releases are cut by pushing a tag like "v1.0.0". The Minecraft version is not in
# the tag: it is read from gradle.properties on the tagged branch, so each Minecraft
# version lives on its own branch (e.g. MultiLoader-1.21.1 -> MC 1.21.1) and is
# released by tagging that branch. The mod version comes from the tag.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve versions
        id: vars
        run: |
          MOD_VERSION="${GITHUB_REF_NAME#v}"
          MC_VERSION="$(grep -E '^minecraft_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')"
          MOD_NAME="$(grep -E '^mod_name=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')"
          echo "mod_version=${MOD_VERSION}" >> "$GITHUB_OUTPUT"
          echo "mc_version=${MC_VERSION}" >> "$GITHUB_OUTPUT"
          echo "mod_name=${MOD_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build both loaders
        run: ./gradlew build -Pversion=${{ steps.vars.outputs.mod_version }} --no-daemon --stacktrace

      - name: Collect loader jars
        run: |
          mkdir -p release
          find fabric/build/libs neoforge/build/libs \
            -name "*-${{ steps.vars.outputs.mod_version }}.jar" \
            ! -name "*-sources.jar" \
            -exec cp {} release/ \;
          echo "Release artifacts:"
          ls -l release

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.vars.outputs.mod_name }} ${{ steps.vars.outputs.mod_version }} (MC ${{ steps.vars.outputs.mc_version }})
          files: release/*.jar
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
